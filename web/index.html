<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="portable-token" content="__TOKEN__"><title>PortableAI · 随身模型助手</title><link rel="stylesheet" href="/style.css"><script src="/app.js" type="module"></script></head>
<body><header><div><span class="logo">P</span><strong>PortableAI</strong><span class="version">随身模型助手 · 0.3.5</span></div><button id="shutdown" class="quiet">退出并安全弹出</button></header>
<main><aside><div class="eyebrow">连接与模型</div><h1>在线与离线，<br>一个入口。</h1><p class="intro">联网使用你配置的 API，调用失败时按设置自动回退到本地模型。</p><div id="system" class="system">正在检测设备…</div>
<form id="settings"><label class="check"><input id="cloudEnabled" type="checkbox">启用云端 API</label><label>接口类型<select id="provider"><option value="anthropic">Claude / Anthropic</option><option value="compatible">兼容 Chat Completions 的 API</option></select></label><label>API 基础地址<input id="baseUrl" type="url" placeholder="https://api.anthropic.com/v1"></label><label>云端模型<input id="model" placeholder="填写服务商提供的模型 ID"></label><label>API 密钥<input id="apiKey" type="password" autocomplete="off" placeholder="默认仅本次运行有效"></label><div id="keyState" class="hint"></div><label class="check"><input id="saveEncrypted" type="checkbox">用密码加密保存密钥</label><label>保存 / 解锁密码<input id="password" type="password" autocomplete="off" placeholder="至少 8 个字符"></label><div class="row"><button type="button" id="unlock" class="quiet">解锁已保存密钥</button><button type="button" id="forgetKey" class="quiet">清除密钥</button></div><label>本地模型<select id="localModel"></select></label><label class="check"><input id="autoFallback" type="checkbox" checked>云端调用失败时自动切换本地</label><label class="check"><input id="preferPortable" type="checkbox">本地与降级优先使用 U 盘模型</label><button class="primary" type="submit">保存连接设置</button></form><p id="settingsNote" class="hint" role="status"></p></aside>
<section class="workspace"><div class="toolbar"><div><span class="dot"></span><span id="route">本地优先</span></div><button id="clear" class="quiet">新对话</button></div><div class="modes"><label class="check"><input id="offline" type="checkbox">仅用本地模型</label><label class="check"><input id="portableOnly" type="checkbox">仅用 U 盘模型</label></div><p id="bundleHint" class="hint mode-hint">正在读取随盘模型信息…</p><p class="hint">此页面保留聊天功能。编程代理请运行 Start-Agent-Windows.cmd，指定项目后可读写文件、执行命令并根据结果继续修复。</p><div id="messages" class="messages" aria-live="polite"><div class="empty"><div class="mark">↗</div><h2>把你的模型带在身边</h2><p>可以直接测试电脑现有模型，或填写 API 配置。<br>离线模型的回答能力取决于随盘携带的模型。</p></div></div><div id="progress" class="progress" role="status">就绪</div><form id="chat" class="composer"><label class="sr-only" for="prompt">输入消息</label><textarea id="prompt" rows="3" placeholder="输入问题，或描述你想生成的代码…" maxlength="10000" required></textarea><div class="composer-bottom"><span>Ctrl + Enter 发送 · 对话保存在 U 盘</span><button class="primary" id="send">发送 ↗</button></div></form></section></main></body></html>
